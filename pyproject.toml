[project]
name = "shared-record"
version = "0.1.0"
description = "Whatever you say, boss: how rank and timing shape what LLM agents enter in a shared record."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["shared_record"]
